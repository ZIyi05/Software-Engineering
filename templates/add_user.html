<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin | Add Internal Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root { 
            --bg: #F8FAFC; --nav-dark: #0F172A; --emerald: #064E3B; --slate: #475569; --border: #E2E8F0; 
            --sidebar-width: 250px; --sidebar-collapsed: 75px;
        }
        body { margin: 0; display: flex; font-family: 'Inter', sans-serif; height: 100vh; background-color: var(--bg); overflow: hidden; }

        /* SIDEBAR - Same as User Management for Consistency */
        .sidebar { 
            width: var(--sidebar-width); background-color: var(--nav-dark); color: white; 
            padding: 40px 24px; flex-shrink: 0; display: flex; flex-direction: column; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; height: 100vh;
            box-sizing: border-box;
        }
        .sidebar.collapsed { width: var(--sidebar-collapsed); padding: 40px 10px; }
        .sidebar h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2.5px; margin-bottom: 50px; color: #FFFFFF; font-weight: 800; white-space: nowrap; transition: 0.3s; }
        .sidebar.collapsed h2 { display: none; }

        .sidebar a { 
            color: #94A3B8; text-decoration: none; padding: 14px 16px; margin-bottom: 8px; 
            border-radius: 8px; display: flex; align-items: center; font-size: 0.95rem; font-weight: 500; 
            transition: 0.2s; white-space: nowrap;
        }
        .sidebar a i { width: 18px; height: 18px; margin-right: 12px; flex-shrink: 0; }
        .sidebar.collapsed a i { margin-right: 0; margin: 0 auto; }
        .sidebar.collapsed a span { display: none; }

        .sidebar a.active { background-color: rgba(255, 255, 255, 0.05); color: white; font-weight: 700; box-shadow: inset 4px 0 0 var(--emerald); }

        .toggle-btn { 
            position: absolute; top: 85px; right: -12px; background: var(--emerald); color: white; 
            border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; z-index: 100; 
            display: flex; align-items: center; justify-content: center; font-size: 0.7rem;
        }

        .logout-link { margin-top: auto !important; color: #94A3B8; text-decoration: none; padding: 14px 16px; display: flex; align-items: center; }

        /* MAIN CONTENT AREA */
        .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; align-items: center; }
        .header-section { width: 100%; max-width: 600px; margin-top: 60px; margin-bottom: 30px; }
        
        /* FORM CARD */
        .form-card { 
            background: white; border-radius: 12px; border: 1px solid var(--border); 
            padding: 40px; width: 100%; max-width: 600px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            box-sizing: border-box;
            margin-bottom: 60px;
        }
        .field { margin-bottom: 25px; }
        .field label { display: block; font-size: 0.7rem; font-weight: 800; color: var(--slate); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .field input, .field select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Inter'; font-size: 0.9rem; box-sizing: border-box; background: #FDFDFD; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 10px; }
        .btn-main { flex: 2; background: var(--nav-dark); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
        .btn-cancel { flex: 1; background: white; color: var(--slate); border: 1px solid var(--border); padding: 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()">◂</button>
        <h2>MERITHUB. ADMIN</h2>
        <nav>
            <a href="{{ url_for('admin_dashboard')}}"><i data-feather="grid"></i><span>Dashboard Overview</span></a>
            <a href="{{ url_for('scholarship_manager')}}"><i data-feather="briefcase"></i><span>Scholarship Manager</span></a>
            <a href="{{ url_for('user_management')}}"><i data-feather="users"></i><span>User Management</span></a>
            <a href="{{ url_for('reviewer_assignment')}}"><i data-feather="check-square"></i><span>Assign Reviewers</span></a>
        </nav>
        <a href="javascript:void(0)" onclick="showLogoutModal()" style="margin-top: auto;"><i data-feather="log-out"></i><span>Logout</span></a>
    </div>

    <div class="main" style="align-items: center; overflow-y: auto; display: flex; flex-direction: column;">
        <div style="width: 100%; max-width: 600px; margin-top: 60px; margin-bottom: 30px;">
            <h1 style="font-weight: 800; font-size: 2.2rem; margin: 0;">Add Internal Staff</h1>
            <p style="color: var(--slate); margin-top: 10px;">Create new accounts for Reviewers or Committee members.</p>
        </div>
        <div style="background: white; border-radius: 12px; border: 1px solid var(--border); padding: 40px; width: 100%; max-width: 600px; box-sizing: border-box;">
            <form action="{{ url_for('add_user_submit') }}" method="POST">
                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-size: 0.7rem; font-weight: 800; color: var(--slate); text-transform: uppercase; margin-bottom: 8px;">Staff Full Name</label>
                    <input type="text" name="fullname" placeholder="e.g. Dr. Sarah Connor" required style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;">
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-size: 0.7rem; font-weight: 800; color: var(--slate); text-transform: uppercase; margin-bottom: 8px;">Employee ID</label>
                    <input type="text" name="userid" placeholder="e.g. STF-9920" required style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;">
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-size: 0.7rem; font-weight: 800; color: var(--slate); text-transform: uppercase; margin-bottom: 8px;">Email Address</label>
                    <input type="email" name="email" placeholder="staff.name@merithub.edu" required style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;">
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-size: 0.7rem; font-weight: 800; color: var(--slate); text-transform: uppercase; margin-bottom: 8px;">Temporary Password</label>
                    <input type="password" name="temp_password" placeholder="••••••••" required style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;">
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-size: 0.7rem; font-weight: 800; color: var(--slate); text-transform: uppercase; margin-bottom: 8px;">Internal Role</label>
                    <select name="role" style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;">
                        <option value="reviewer">Reviewer</option>
                        <option value="committee">Committee</option>
                    </select>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 10px;">
                    <button type="button" onclick="window.location.href='{{ url_for('user_management') }}';" style="flex: 1; padding: 16px; border-radius: 8px; border: 1px solid var(--border); font-weight: 700; cursor: pointer;">Cancel</button>
                    <button type="submit" style="flex: 2; background: var(--nav-dark); color: white; padding: 16px; border-radius: 8px; font-weight: 700; cursor: pointer;">Create Account</button>
                </div>
            </form>
        </div>
    </div>

    <div id="logoutModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:10001; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:12px; width:350px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
            <h3 style="margin-top:0; color:var(--sidebar);">MeritHub</h3>
            <p style="color:var(--slate); font-size:0.9rem; margin-bottom:25px;">Are you sure you want to log out?</p>
            <div style="display:flex; gap:10px;">
                <button onclick="closeLogoutModal()" style="flex:1; padding:12px; border-radius:8px; border:1px solid var(--border); background:white; cursor:pointer; font-weight:600;">Cancel</button>
                <a href="{{ url_for('logout') }}" style="flex:1; padding:12px; border-radius:8px; border:none; background:#991B1B; color:white; cursor:pointer; font-weight:600; text-decoration:none; display:flex; align-items:center; justify-content:center;">Yes, Log out</a>
            </div>
        </div>
    </div>

    <script>
        feather.replace();
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.querySelector('.toggle-btn');
            sidebar.classList.toggle('collapsed');
            btn.innerText = sidebar.classList.contains('collapsed') ? '▸' : '◂';
        }

        function showLogoutModal() { document.getElementById('logoutModal').style.display = 'flex'; }
        function closeLogoutModal() { document.getElementById('logoutModal').style.display = 'none'; }

        window.onclick = function(event) {
                    const logoutModal = document.getElementById('logoutModal');
                    if (event.target == logoutModal) { closeLogoutModal(); }
        };
    </script>
</body>
</html>
