<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin | Account Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root { 
            --bg: #F8FAFC; --nav-dark: #0F172A; --emerald: #064E3B; --slate: #475569; --border: #E2E8F0; 
            --sidebar-width: 260px; --sidebar-collapsed: 75px;
        }
        body { margin: 0; display: flex; font-family: 'Inter', sans-serif; height: 100vh; background-color: var(--bg); overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: var(--sidebar-width); background-color: var(--nav-dark); color: white; padding: 40px 24px; flex-shrink: 0; display: flex; flex-direction: column; transition: 0.3s; position: relative; height: 100vh; box-sizing: border-box; }
        .sidebar h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2.5px; margin-bottom: 50px; color: #FFFFFF; font-weight: 800; }
        .sidebar a { color: #94A3B8; text-decoration: none; padding: 14px 16px; margin-bottom: 8px; border-radius: 8px; display: flex; align-items: center; font-size: 0.95rem; transition: 0.2s; }
        .sidebar a i { width: 18px; height: 18px; margin-right: 12px; }
        .sidebar a.active { background-color: rgba(255, 255, 255, 0.05); color: white; font-weight: 700; box-shadow: inset 4px 0 0 var(--emerald); }
        .toggle-btn { position: absolute; top: 85px; right: -12px; background: var(--emerald); color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
        .logout-link { margin-top: auto !important; }

        /* MAIN CONTENT */
        .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; align-items: center; }
        .header-section { width: 100%; max-width: 600px; margin-top: 60px; margin-bottom: 30px; }
        
        /* SETTINGS CARD */
        .form-card { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 40px; width: 100%; max-width: 600px; box-sizing: border-box; }
        
        /* FOCUS BOX - MATCHES SCREENSHOT */
        .user-focus-box { 
            background: #F1F5F9; padding: 25px; border-radius: 10px; 
            border-left: 5px solid var(--nav-dark); margin-bottom: 30px; 
        }
        .user-focus-box p { margin: 0; font-size: 0.8rem; color: var(--slate); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .user-focus-box b { font-size: 1.25rem; color: var(--nav-dark); display: block; margin-top: 5px; }

        /* BUTTONS */
        .btn-wide { width: 100%; padding: 16px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 15px; font-family: 'Inter'; font-size: 0.9rem; border: 1px solid var(--border); transition: 0.2s; }
        .btn-reset { background: white; color: var(--nav-dark); }
        .btn-danger { background: #FEE2E2; border-color: #FCA5A5; color: #991B1B; }
        .btn-danger:hover { background: #fecaca; }
        .btn-save { background: var(--emerald); color: white; border: none; margin-top: 15px; }
        .btn-save:hover { filter: brightness(1.1); }
        
        .back-link { background: none; border: none; width: 100%; color: var(--slate); font-weight: 600; cursor: pointer; margin-top: 10px; font-size: 0.9rem; text-decoration: none; display: block; text-align: center; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <button class="toggle-btn" onclick="toggleSidebar()">◂</button>
        <h2>MERITHUB. ADMIN</h2>
        <nav style="display: flex; flex-direction: column;">
            <a href="{{ url_for('admin_dashboard') }}"><i data-feather="grid"></i><span>Dashboard Overview</span></a>
            <a href="{{ url_for('scholarship_manager') }}"><i data-feather="briefcase"></i><span>Scholarship Manager</span></a>
            <a href="{{ url_for('user_management') }}" class="active"><i data-feather="users"></i><span>User Management</span></a>
            <a href="{{ url_for('reviewer_assignment') }}"><i data-feather="check-square"></i><span>Assign Reviewers</span></a>
        </nav>
        <a href="{{ url_for('logout') }}" class="logout-link"><i data-feather="log-out"></i><span>Logout</span></a>
    </div>

    <div class="main">
        <div class="header-section">
            <h1 style="font-weight: 800; font-size: 2.2rem; margin: 0;">Account Settings</h1>
        </div>

        <div class="form-card">
            <div class="user-focus-box">
                <p>MANAGING ACCOUNT FOR</p>
                <b>{{ user.fullName }} (ID: {{ user.userID }})</b>
            </div>

            <button class="btn-wide btn-reset" onclick="alert('Reset link sent to {{ user.email }}')">
                Reset User Password
            </button>
            
            <form action="{{ url_for('delete_user', userid=user.userID) }}" method="POST" onsubmit="return confirm('Are you sure? This user will lose access immediately.');">
                <button type="submit" class="btn-wide btn-danger">Deactivate Account</button>
            </form>
            
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 30px 0;">
            
            <button class="btn-wide btn-save" onclick="location.href='{{ url_for('user_management') }}'">Save Changes</button>
            <a href="{{ url_for('user_management') }}" class="back-link">Cancel and Go Back</a>
        </div>
    </div>

    <script>
        feather.replace();
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.querySelector('.toggle-btn');
            sidebar.classList.toggle('collapsed');
            btn.innerText = sidebar.classList.contains('collapsed') ? '▸' : '◂';
        }
    </script>
</body>
</html>
