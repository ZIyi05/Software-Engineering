<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeritHub | Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        :root {
            --bg: #F8FAFC; 
            --nav-dark: #0F172A; 
            --emerald: #064E3B;
            --slate: #475569;
            --border: #E2E8F0;
            --white: #FFFFFF;
            --input-bg: #FAFBFC;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 40px 20px;
        }

        .reg-card {
            background: var(--white);
            padding: 50px 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
            text-align: center;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--nav-dark);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--slate);
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            text-align: left;
        }

        .full-width { grid-column: span 2; }

        .form-group { margin-bottom: 5px; }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--slate);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            background-color: var(--input-bg);
            box-sizing: border-box; 
            transition: border-color 0.2s;
            color: var(--nav-dark);
        }

        textarea { height: 95px; resize: none; }

        input:focus, select:focus, textarea:focus {
            border-color: var(--nav-dark);
            outline: none;
            background-color: #fff;
        }

        /* 修复后的密码包装器样式 */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .eye-icon {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: var(--slate);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: transparent;
            border: none;
            padding: 0;
        }

        .eye-icon svg {
            width: 18px;
            height: 18px;
        }

        .btn-register {
            background: var(--nav-dark);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 30px;
            transition: opacity 0.2s;
        }

        .btn-register:hover { opacity: 0.9; }

        .phone-input-group {
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: white;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .country-prefix {
            padding: 12px 0 12px 14px;
            color: var(--slate);
            font-weight: 600;
            font-size: 0.9rem;
            background: white;
            user-select: none;
        }

        .phone-input-group input {
            border: none !important;
            flex: 1;
            padding-left: 5px !important;
        }

        .phone-input-group:focus-within {
            border-color: var(--nav-dark);
        }

        .footer-links {
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--slate);
        }

        .footer-links a {
            color: var(--emerald);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="reg-card">
        <div class="brand">MERITHUB.</div>
        <div class="subtitle">Join the MeritHub Student Community</div>

        <form action="/register" method="POST" onsubmit="return validateForm()">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Full Name</label>
                    <input type="text" name="fullName" placeholder="As per IC/Passport" required>
                </div>

                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" name="studentID" placeholder="e.g. std0001" oninput="validateStudentID(this)" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="xxxx@student.merithub.edu.my" required>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" name="dob" id="dobField" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="phone-input-group">
                        <span class="country-prefix">+60</span>
                        <input type="tel" name="phone" id="regPhone" 
                            placeholder="123456789" 
                            oninput="validatePhone(this)" 
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Home Address</label>
                    <textarea name="address" placeholder="Residential Address" required></textarea>
                </div>

                <div class="form-group">
                    <label>Gender & Faculty</label>
                    <select name="gender" required style="margin-bottom: 10px;">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                    <select name="faculty" required>
                        <option value="">Select Faculty</option>
                        <option value="FCI">FCI</option>
                        <option value="FOE">FOE</option>
                        <option value="FOB">FOB</option>
                        <option value="FCM">FCM</option>
                        <option value="FCA">FCA</option>
                        <option value="FIST">FIST</option>
                        <option value="FOM">FOM</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Course</label>
                    <input type="text" name="course" placeholder="e.g. Computer Science" required>
                </div>

                <div class="form-group">
                    <label>Create Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="passwordField" placeholder="Min. 8 characters" minlength="8" required>
                        <div class="eye-icon" onclick="togglePasswordVisibility()">
                            <i data-feather="eye" id="eyeIcon"></i>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-register">Register Account</button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="{{ url_for('index') }}">Log In</a>
        </div>
    </div>

    <script>
        feather.replace();

        window.addEventListener('load', function() {
            const today = new Date().toISOString().split("T")[0];
            const dobField = document.getElementById('dobField');
            if (dobField) {
                dobField.setAttribute('max', today);
            }
        });

        function validatePhone(input) {
            let val = input.value.replace(/[^0-9]/g, '');
            if (val.startsWith('0')) {
                val = val.substring(1);
            }
            if (val.length > 10) {
                val = val.substring(0, 10);
            }
            input.value = val;

            if (val.length > 0 && val.length < 9) {
                input.setCustomValidity("Phone number must be at least 9 digits.");
            } else {
                input.setCustomValidity(""); 
            }
        }

        function validateStudentID(input) {
            const val = input.value.toLowerCase();
            if (val.length > 0 && !val.startsWith('std')) {
                input.setCustomValidity("Student ID must start with 'std'."); 
            } else {
                input.setCustomValidity("");
            }
        }

        function togglePasswordVisibility() {
            const passwordField = document.getElementById('passwordField');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.setAttribute('data-feather', 'eye');
            } else {
                passwordField.type = 'password';
                eyeIcon.setAttribute('data-feather', 'eye-off');
            }
            feather.replace(); 
        }
    </script>
</body>
</html>
